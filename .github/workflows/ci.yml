# =============================================================================
# AI Gym Trainer FYP — CI: lint + test
#
# Triggers : push and pull_request targeting master
# Matrix   : Python 3.11 on ubuntu-latest and windows-latest
# Steps    : checkout → setup-python → pip install → pylint → pytest
#
# NOTE: Claude Code is a dev-time tool only and is NOT installed here.
# =============================================================================
name: lint-and-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Upgrade pip and install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest

      # ── 4. Lint — production packages only ───────────────────────────────────
      #   We target core/, pipeline/, exercises/, utils/ which contain all
      #   production code. training/ and tools/ contain legacy/experimental
      #   scripts with pre-existing violations that are out of scope for CI.
      - name: Run pylint
        run: |
          pylint core/ pipeline/ exercises/ utils/ \
            --rcfile=.pylintrc \
            --fail-under=7.0
        shell: bash

      # ── 5. Run pytest (skip gracefully if tests/ is absent or empty) ─────────
      - name: Run pytest
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/ 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "tests/ directory is absent or empty — skipping pytest."
          fi
        shell: bash
